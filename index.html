<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c111c" />
    <meta name="description" content="Portfolio of an information technology student creating web, mobile and software experiences." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YOUR NAME — Portfolio" />
    <meta property="og:description" content="A portfolio of projects, skills and experiences in web and mobile development." />
    <meta property="og:image" content="./assets/og-image.png" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YOUR NAME — Portfolio" />
    <meta name="twitter:description" content="Explore my projects, experience and journey in technology." />
    <meta name="twitter:image" content="./assets/og-image.png" />
    <link rel="canonical" href="https://yourdomain.com" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/profile-placeholder.svg" as="image" type="image/svg+xml" />
    <title>YOUR NAME — Portfolio</title>
    <script>
      // Read theme before styles load to avoid a flash when returning to the site.
      try {
        const saved = localStorage.getItem('portfolio-theme');
        const wantsDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : wantsDark ? 'dark' : 'light';
      } catch (_) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <main id="main"><p class="noscript-fallback">Loading portfolio…</p></main>
    </div>
    <noscript><p class="noscript">This portfolio uses a small amount of JavaScript to display sections and project details. Please enable JavaScript.</p></noscript>
  </body>
</html>
