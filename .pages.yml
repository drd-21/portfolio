media:
  - name: portfolio-images
    label: Portfolio images
    input: assets/uploads/images
    output: assets/uploads/images
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe
  - name: portfolio-documents
    label: Resume and CV PDFs
    input: assets/uploads/documents
    output: assets/uploads/documents
    categories:
      - document
    extensions:
      - pdf
    rename: safe

settings:
  content: true
  commit:
    identity: app

content:
  - name: profile
    label: Profile and Hero
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Full name
        type: string
        required: true
      - name: initials
        label: Name initials
        type: string
        required: true
      - name: role
        label: Professional title
        type: string
        required: true
      - name: intro
        label: Hero introduction
        type: text
        required: true
      - name: tagline
        label: Footer tagline
        type: text
      - name: availability
        label: Availability status
        type: string
      - name: city
        label: City or region
        type: string
      - name: country
        label: Country
        type: string
      - name: email
        label: Public email
        type: string
        required: true
      - name: phone
        label: Public phone
        type: string
      - name: photo
        label: Profile photo
        type: image
        required: true
        options:
          media: portfolio-images
          path: assets/uploads/images/profile
          extensions:
            - jpg
            - jpeg
            - png
            - webp
      - name: photoAlt
        label: Profile photo alternative text
        type: string
  - name: about
    label: About Me
    type: file
    path: content/about.json
    format: json
    fields:
      - name: headline
        label: Section headline
        type: string
        required: true
      - name: paragraphs
        label: Biography paragraphs
        type: text
        list: true
      - name: interests
        label: Interests and hobbies
        type: string
        list: true
      - name: facts
        label: Personal facts
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Fact label
            type: string
            required: true
          - name: value
            label: Fact
            type: string
            required: true

  - name: education
    label: Education
    type: file
    path: content/education.json
    format: json
    list: true
    fields:
      - name: school
        label: School
        type: string
        required: true
      - name: degree
        label: Degree
        type: string
        required: true
      - name: period
        label: Academic period
        type: string
        required: true
      - name: location
        label: Location
        type: string
      - name: details
        label: Description
        type: text
      - name: highlights
        label: Relevant coursework and highlights
        type: string
        list: true
      - name: honors
        label: Honors and awards
        type: string
        list: true

  - name: experience
    label: Experience and Leadership
    type: file
    path: content/experience.json
    format: json
    list: true
    fields:
      - name: role
        label: Position or role
        type: string
        required: true
      - name: organization
        label: Organization
        type: string
        required: true
      - name: period
        label: Dates
        type: string
        required: true
      - name: type
        label: Experience type
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: bullets
        label: Responsibilities
        type: string
        list: true
      - name: achievements
        label: Achievements
        type: string
        list: true

  - name: skills
    label: Skills
    type: file
    path: content/skills.json
    format: json
    list: true
    fields:
      - name: category
        label: Category
        type: string
        required: true
      - name: icon
        label: Category icon
        type: select
        required: true
        options:
          values:
            - code
            - layers
            - terminal
            - pen
            - sparkles
      - name: items
        label: Skills and optional proficiency descriptions
        type: object
        list: true
        fields:
          - name: name
            label: Skill
            type: string
            required: true
          - name: proficiency
            label: Optional description (no percentages)
            type: text

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename:
      template: "{fields.id}.json"
      field: create
    view:
      primary: title
      sort: displayOrder
      order: asc
    fields:
      - name: id
        label: Unique project ID (lowercase, hyphen-separated)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Use lowercase letters, numbers, and hyphens."
      - name: title
        label: Project name
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: category
        label: Category
        type: string
        required: true
      - name: year
        label: Development year or period
        type: string
        required: true
      - name: status
        label: Development status (optional)
        type: string
        description: "Describe the current state only when it is verified; leave blank otherwise."
      - name: badge
        label: Card badge
        type: string
      - name: image
        label: Thumbnail
        type: image
        required: true
        options:
          media: portfolio-images
          path: assets/uploads/images/projects
          extensions:
            - jpg
            - jpeg
            - png
            - webp
      - name: imageAlt
        label: Thumbnail alternative text
        type: string
        required: true
      - name: summary
        label: Short summary
        type: text
        required: true
      - name: detail
        label: Full description
        type: text
        required: true
      - name: contribution
        label: Contributions
        type: string
        list: true
      - name: tags
        label: Technologies
        type: string
        list: true
      - name: features
        label: Features
        type: string
        list: true
      - name: challenges
        label: Development challenges
        type: string
        list: true
      - name: screenshots
        label: Screenshots
        type: image
        options:
          media: portfolio-images
          path: assets/uploads/images/projects
          multiple:
            max: 8
          unique: true
          extensions:
            - jpg
            - jpeg
            - png
            - webp
      - name: github
        label: GitHub repository URL
        type: string
      - name: demo
        label: Live demonstration URL
        type: string
      - name: displayOrder
        label: Display order
        type: number
        options:
          min: 0
      - name: featured
        label: Featured project
        type: boolean
        default: false
      - name: published
        label: Published on website
        type: boolean
        default: false

  - name: certifications
    label: Certifications and Awards
    type: collection
    path: content/certifications
    format: json
    filename:
      template: "{fields.title}.json"
      field: create
    view:
      primary: title
    exclude:
      - README.md
    fields:
      - name: title
        label: Credential title
        type: string
        required: true
      - name: issuer
        label: Issuing organization
        type: string
        required: true
      - name: date
        label: Issue date
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: credentialId
        label: Credential ID
        type: string
      - name: url
        label: Verification URL
        type: string
      - name: image
        label: Certificate image
        type: image
        options:
          media: portfolio-images
          path: assets/uploads/images/certifications
          extensions:
            - jpg
            - jpeg
            - png
            - webp
      - name: displayOrder
        label: Display order
        type: number
        options:
          min: 0

  - name: cv
    label: On-page CV
    type: file
    path: content/cv.json
    format: json
    fields:
      - name: objective
        label: Profile
        type: text
      - name: additional
        label: Additional details
        type: string
        list: true

  - name: documents
    label: Resume and CV
    type: file
    path: content/documents.json
    format: json
    fields:
      - name: resumePath
        label: Resume PDF
        type: file
        required: true
        options:
          media: portfolio-documents
          path: assets/uploads/documents
          extensions:
            - pdf
      - name: cvPath
        label: CV PDF
        type: file
        required: true
        options:
          media: portfolio-documents
          path: assets/uploads/documents
          extensions:
            - pdf

  - name: social-links
    label: Social Media
    type: file
    path: content/socials.json
    format: json
    list: true
    fields:
      - name: label
        label: Platform name
        type: string
        required: true
      - name: icon
        label: Icon
        type: select
        options:
          values:
            - github
            - linkedin
            - facebook
            - instagram
            - globe
      - name: url
        label: Profile URL (leave blank to hide)
        type: string

  - name: contact
    label: Contact Information
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: eyebrow
        label: Section label
        type: string
      - name: headline
        label: Headline
        type: string
        required: true
      - name: description
        label: Contact introduction
        type: text
      - name: formspreeId
        label: Formspree form ID
        type: string
        required: true
        description: "Public form ID only; never enter a private API key."
      - name: successMessage
        label: Successful submission message
        type: text

  - name: website-seo
    label: Website Settings and SEO
    type: file
    path: content/seo.json
    format: json
    fields:
      - name: description
        label: Search description
        type: text
        required: true
      - name: websiteUrl
        label: Published website URL
        type: string
        required: true
        description: "Keep the GitHub Pages project path, e.g. https://drd-21.github.io/portfolio/."
      - name: ogImage
        label: Social sharing image
        type: image
        options:
          media: portfolio-images
          path: assets/uploads/images
          extensions:
            - jpg
            - jpeg
            - png
            - webp
